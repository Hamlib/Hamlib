name: Windows mingw-w64 cross C/C++ (no features)

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
    - uses: actions/checkout@v6
    - name: Install cross toolchain and Wine
      run: |
        sudo apt update
        sudo apt install -y mingw-w64 wine64 automake autoconf libtool texinfo
        sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix
        sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix
    - name: bootstrap
      run: ./bootstrap
    - name: configure
      run: >-
        ./configure --host=x86_64-w64-mingw32
        --without-cxx-binding --without-libusb --without-samplerate
        --disable-static
    - name: make
      run: make -j $(nproc) V=0 --no-print-directory
    - name: Build test suite executables
      run: |
        make -C tests rigstreamtest.exe V=0 --no-print-directory
        # checkprogs builds every acutest suite listed in test/Makefile.am,
        # so new suites are covered here without workflow changes.
        make -C test checkprogs V=0 --no-print-directory
    - name: Run test suites under Wine
      run: |
        export WINEPREFIX=$HOME/.wineprefix WINEDEBUG=-all
        # Ubuntu's wine64 package ships only the loader; /usr/bin/wine64
        # appears when the wine metapackage is installed, so fall back.
        WINE=$(command -v wine64 || command -v wine || echo /usr/lib/wine/wine64)
        cp src/.libs/libhamlib-*.dll test/.libs/
        cp /usr/x86_64-w64-mingw32/lib/libwinpthread-1.dll test/.libs/ || true
        cp /usr/lib/gcc/x86_64-w64-mingw32/*-posix/libgcc_s_seh-1.dll test/.libs/ || true
        cd test/.libs
        rc=0
        # Every built suite runs — the glob tracks test/Makefile.am.
        for exe in test_*.exe; do
          echo "=== ${exe%.exe} ==="
          if ! "$WINE" "$exe"; then
            echo "FAILED: ${exe%.exe}"
            rc=1
          fi
        done
        exit $rc
