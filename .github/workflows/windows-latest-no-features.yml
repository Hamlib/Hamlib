name: Windows latest C/C++ (no features)

on:
  push:
    branches: [ master, feature/* ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    strategy:
      matrix:
        os: [windows-latest]
        configure_args:
          - >-
            --enable-html-matrix=no
            --enable-parallel=no
            --enable-pytest=no
            --enable-shared=yes
            --enable-silent-rules
            --enable-static=yes
            --enable-usrp=no
            --enable-winradio=no
            --with-cxx-binding=no
            --with-indi=no
            --with-libusb=no
            --with-lua-binding=no
            --with-perl-binding=no
            --with-python-binding=no
            --with-readline=no
            --with-samplerate=no
            --with-tcl-binding=no
            --with-xml-support=no

    defaults:
      run:
        shell: msys2 {0}

    steps:
    - uses: actions/checkout@v6
    - name: Set up MSYS2 (MINGW64)
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: false
        install: >-
          autoconf
          automake
          libtool
          make
          pkgconf
          git
        pacboy: >-
          gcc:p
    - name: bootstrap
      run: |
        pwd
        ./bootstrap
    - name: configure
      run: ./configure ${{ matrix.configure_args }}
    - name: make distcheck
      run: make distcheck V=0 --no-print-directory AM_DISTCHECK_CONFIGURE_FLAGS="${{ matrix.configure_args }}"
    - name: Dump test logs on failure
      if: failure()
      run: find . -name test-suite.log -print -exec cat {} \;
    - name: 'tar files'
      run: tar -cvf windows_latest_no_features.tar $(pwd)
    - name: 'Upload Build Artifact'
      uses: actions/upload-artifact@v4.6.2
      with:
        name: 'Windows_latest_no_features'
        path: windows_latest_no_features.tar
